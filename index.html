<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>쓸데없는 잡학 뽑기</title>
<style>
:root{--bg:#eef3fb;--card:#ffffff;--ink:#1d2a44;--sub:#6b7a99;--accent:#ff5d8f;--accent2:#ffd23f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a2b;--card:#1f2740;--ink:#f1f4ff;--sub:#9aa8c9;--accent:#ff7aa5;--accent2:#ffd23f}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Jua","Apple SD Gothic Neo","Noto Sans KR",sans-serif;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:480px;display:flex;flex-direction:column;gap:20px;align-items:stretch}
h1{font-size:1.6rem;margin:8px 0 0;text-align:center}
.count{text-align:center;color:var(--sub);font-size:.95rem;margin:0}
.card{background:var(--card);border-radius:24px;padding:28px 24px;min-height:220px;display:flex;flex-direction:column;justify-content:center;gap:14px;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
.emoji{font-size:3rem;line-height:1}
.fact{font-size:1.2rem;line-height:1.65;margin:0;word-break:keep-all}
.tag{align-self:flex-start;background:var(--accent2);color:#1d2a44;border-radius:999px;padding:3px 12px;font-size:.85rem}
.card.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.94) rotate(-1deg)}60%{transform:scale(1.02)}100%{transform:none}}
button{font:inherit;font-size:1.3rem;background:var(--accent);color:#fff;border:3px solid var(--ink);border-radius:18px;padding:16px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .1s,box-shadow .1s}
button:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
button:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}
#btn:disabled{opacity:.55;cursor:not-allowed}
#btn:disabled:active{transform:none;box-shadow:4px 4px 0 var(--ink)}
@media (prefers-reduced-motion:reduce){.card.pop{animation:none}}
[hidden]{display:none!important}
.view{display:flex;flex-direction:column;gap:20px}
.tabs{display:flex;gap:8px}
.tab,.chip{background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:8px 16px;font-size:1rem;box-shadow:none}
.tab{flex:1;font-size:1.1rem;padding:10px}
.tab[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--accent2);color:#1d2a44}
.tab:active,.chip:active{transform:scale(.96);box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
#dictList{display:flex;flex-direction:column;gap:10px}
#dictList h2{font-size:1.1rem;margin:10px 0 0}
.entry{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:12px 14px;line-height:1.6;word-break:keep-all}
.empty{text-align:center;color:var(--sub);line-height:1.7;padding:32px 8px;margin:0}
</style>
</head>
<body>
<main>
  <h1>쓸데없는 잡학 뽑기</h1>
  <div class="view" id="drawView">
  <div class="chips" id="chips" role="group" aria-label="분야 선택"></div>
  <p class="count" id="count">버튼을 눌러보세요</p>
  <section class="card" id="card" aria-live="polite">
    <span class="emoji" id="emoji">🎲</span>
    <span class="tag" id="tag">준비 완료</span>
    <p class="fact" id="fact">알아도 인생에 도움은 안 되지만, 괜히 말하고 싶어지는 지식을 뽑아드립니다.</p>
  </section>
  <button id="btn" type="button">잡학 하나 뽑기</button>
  </div>
  
</main>

  ["전체",...cats].forEach(c=>{
    const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=c;

    box.appendChild(b);
  });
}

  const b=$("btn");let s=5;

}
